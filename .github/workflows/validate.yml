name: myTIME validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Keep only the newest validation for each branch. Superseded commits are
# cancelled instead of sending stale failure notifications.
concurrency:
  group: mytime-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests and source audit
        run: npm test
